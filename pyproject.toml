[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amfe"
version = "0.1.0"
description = "Phase A scaffolding for AMFE-Backbone + AMF-Neck with Ultralytics Detect integration."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "ultralytics>=8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]

[tool.setuptools]
packages = ["amfe", "amfe.models"]
